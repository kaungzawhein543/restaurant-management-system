<!DOCTYPE html>
<html lang="en"  xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Register</title>
    <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" th:href="@{/css/output.css}">
</head>
<body>
<div class="flex justify-center items-center min-h-screen h-full w-full bg-gray-300">
  <div class="">
    <form class="p-3 bg-white items-center flex-col flex gap-4 shadow-sm" autocomplete="off" method="post" th:action="@{${WebUrl.REGISTER_URL}}" th:object="${user}">
      <h2 class="text-blue-400 font-bold text-xl">Register</h2>
      <p class="text-red-500 text-sm mt-1 break-words" th:if="${status == ResponseStatus.FAILED}" th:text="${ERROR_MESSAGE}">Register Error</p>
      <div class="w-60">
        <input class="w-60 p-1 border border-blue-400 placeholder-gray-200 border-opacity-50"
               autocomplete="new-username" type="text" th:field="*{username}" placeholder="Username">
        <div class="text-xs text-red-500 text-sm mt-1 break-words" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
      </div>
      <div class="w-60">
        <input class="w-60 p-1 border border-blue-400 placeholder-gray-200 border-opacity-50" type="text"
               th:field="*{name}" placeholder="Full name">
        <div class="text-xs text-red-500 text-sm mt-1 break-words" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
      </div>
      <div class="w-60">
        <input class="w-60 p-1 border border-blue-400 placeholder-gray-200 border-opacity-50"
               autocomplete="new-password" type="password" th:field="*{password}" placeholder="Password">
        <div class="text-xs text-red-500 text-sm mt-1 break-words" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
      </div>
      <div class="w-60">
        <input class="w-60 p-1 border border-blue-400 placeholder-gray-200 border-opacity-50" type="number"
               th:field="*{age}" placeholder="Age">
        <div class="text-xs text-red-500 text-sm mt-1 break-words" th:if="${#fields.hasErrors('age')}" th:errors="*{age}"></div>
      </div>
      <div class="w-60">
        <input class="w-60 p-1 border border-blue-400 placeholder-gray-200 border-opacity-50" type="email"
               th:field="*{email}" placeholder="Email">
        <div class="text-xs text-red-500 text-sm mt-1 break-words" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
      </div>
      <div class="w-60">
        <input
                class="border-opacity-50 w-60 p-1 border border-blue-400 cursor-pointer bg-blue-400 text-white hover:bg-white hover:text-blue-400"
                type="submit" value="Register">
      </div>
      <p class="text-xs"><span>Already have an
                        account?</span><a class="cursor-pointer underline text-blue-300 hover:text-gray-500" th:href="@{${WebUrl.LOGIN_URL}}"> Login here</a></p>
    </form>
  </div>
</div>
</body>
</html>
